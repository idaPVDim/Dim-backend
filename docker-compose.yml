#version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: idav_db
      POSTGRES_USER: ye
      POSTGRES_PASSWORD: codewithme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    volumes:
      - ./idav:/app/idav
      - ./manage.py:/app/manage.py
      - ./requirements.txt:/app/requirements.txt
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=idav.settings
    depends_on:
      - db
    working_dir: /app
    command: >
      sh -c "
      python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

volumes:
  postgres-data:
